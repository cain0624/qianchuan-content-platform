# 敏感类目特殊红线（种子库）
# 字段：类目、触发词(出现即提示该类目)、红线(list)、severity

categories:
  - 类目: 医疗/药品/医疗器械
    触发词: [医院, 诊所, 诊疗, 治疗, 疗法, 药品, 处方, 医疗器械, 保健品]
    severity: high
    红线:
      - 须经《医疗广告审查证明》审查，未审不得发布
      - 不得含功效保证、治愈率、有效率
      - 不得与其他医疗/药品/器械对比
      - 不得利用医生/专家/患者名义作推荐证明
      - 不得说明治愈率/有效率

  - 类目: 保健食品
    触发词: [保健食品, 蓝帽, 保健品, 辅助降, 改善, 调节]
    severity: high
    红线:
      - 须标"本品不能代替药物"
      - 不得涉及疾病预防/治疗功能
      - 不得利用国家机关/单位/个人名义作推荐证明
      - 不得含功效保证

  - 类目: 普通食品
    触发词: [零食, 饮料, 食品, 调味, 茶叶, 粮油]
    severity: high
    红线:
      - 不得宣称保健/疾病预防治疗功能
      - 不得宣称"治疗/降糖/降压/抗癌/减肥"等功能
      - 纯天然、零添加、无添加 须有成分证据

  - 类目: 化妆品
    触发词: [化妆品, 护肤, 面霜, 精华, 口红, 面膜, 洗护]
    severity: medium
    红线:
      - 不得宣称医疗作用（治疗/消炎/抗敏/祛病）
      - 不得宣称"纯天然/无毒/无副作用"等绝对化
      - 功效宣称须有产品功效评价报告支撑

  - 类目: 金融理财
    触发词: [理财, 基金, 保险, 贷款, 投资, 收益, 年化, P2P, 加密货币]
    severity: high
    红线:
      - 不得对未来效果/收益作保证性承诺（保本/保收益/稳赚）
      - 不得宣称"零风险/无风险"
      - 须警示投资风险
      - 须具备金融业务资质

  - 类目: 教育培训
    触发词: [培训, 课程, 辅导, 升学, 考研, 公考, 留学, 班型, 录取]
    severity: high
    红线:
      - 不得对升学/通过考试/获得学位/取得效果作保证性承诺（包过/保过/包就业）
      - 不得明示/暗示与考试机构/院校有合作关系（无依据）
      - 不得利用受益者名义作推荐证明

  - 类目: 酒类
    触发词: [白酒, 啤酒, 红酒, 洋酒, 黄酒, 米酒, 精酿, 调酒]
    severity: high
    红线:
      - 不得出现饮酒/诱导饮酒动作
      - 不得明示/暗示饮酒有消除紧张/增加体力等功效
      - 不得出现驾驶车/船/飞机/操作机械等活动
      - 不得出现未成年人形象或针对未成年人

  - 类目: 房地产
    触发词: [楼盘, 房产, 公寓, 别墅, 写字楼, 商铺, 户型, 学区]
    severity: high
    红线:
      - 不得含升值/投资回报承诺
      - 不得以到某一参照物所需时间表示距离
      - 不得违反价格管理规定（价格内/外不一致）
      - 不得使用"学区房"等违规表述作误导

  - 类目: 招商加盟
    触发词: [加盟, 代理, 招商, 连锁, 创业项目, 开店]
    severity: high
    红线:
      - 不得对未来收益作保证性承诺
      - 不得宣称"零风险/稳赚/回本快"等
      - 须具备特许经营备案（商业特许经营）

  - 类目: 烟草/电子烟
    触发词: [香烟, 烟草, 电子烟, 烟弹]
    severity: high
    红线:
      - 禁止在大众媒介/互联网发布烟草广告
      - 电子烟广告受严格限制
