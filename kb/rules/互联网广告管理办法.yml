# 《互联网广告管理办法》核心要点（种子库）
# 2023年5月1日施行；2025年9月《人工智能生成合成内容标识办法》对AI生成广告内容另有标识要求

rules:
  - id: NET-01
    要点: 软文须显著标明"广告"
    说明: 通过知识介绍/体验分享/消费测评等形式推销商品/服务的，应显著标明"广告"，使消费者辨明其为广告
    触发词: [种草, 测评, 体验分享, 推荐, 干货]
    severity: medium

  - id: NET-02
    要点: 弹窗广告须一键关闭
    说明: 弹窗广告应显著标明关闭标志/确保一键关闭；不得以虚假关闭诱导点击
    触发词: [弹窗, 一键关闭, 关闭]
    severity: medium

  - id: NET-03
    要点: 不得以欺骗/诱导方式点击
    说明: 不得以虚假的系统提示/虚假关闭按钮/诱导点击等欺骗误导用户点击广告
    触发词: [系统提示, 您有一条消息, 立即清理]
    severity: high

  - id: NET-04
    要点: 直播/达人带货视为广告发布者
    说明: 直播营销/达人种草等构成广告发布的，承担广告发布者责任，需显著标明广告
    触发词: [直播, 带货, 达人, 主播]
    severity: medium

  - id: NET-05
    要点: AI生成广告内容须标识
    说明: "依据2025年9月施行的《人工智能生成合成内容标识办法》，AI生成的广告图文/视频应对外发布时须携带AI生成标识（显式水印或元数据标识），不得删除/篡改/隐蔽"
    触发词: [AI生成, AI制作, 智能生成, 一键生成]
    severity: high
    note: AI生成的物料如未标识，本身即合规风险

  - id: NET-06
    要点: 不得利用互联网发布烟草广告
    说明: 禁止在互联网发布烟草（含电子烟）广告
    触发词: [电子烟, 烟弹, 香烟]
    severity: high

  - id: NET-07
    要点: 教育/医疗/金融等须经审查或不得发布
    说明: 医疗/药品/器械/保健食品/特殊医学用途配方食品/金融理财/教育培训等广告须符合特别规定，部分须经审查
    触发词: [医疗, 药品, 保健, 金融, 理财, 培训]
    severity: medium
