# 《广告法》核心条款索引（种子库）
# 字段：id, 条款号, 类目, 禁止行为, 触发词(list), severity, note

clauses:
  - id: ADV-A09
    条款号: 广告法第9条
    类目: 绝对化用语
    禁止行为: 使用"国家级、最高级、最佳"等绝对化用语
    触发词: [国家级, 最高级, 最佳, 最好, 第一, 顶级, 唯一]
    severity: high
    note: 命中极限词即大概率违反本条

  - id: ADV-A10
    条款号: 广告法第10条
    类目: 引证失实
    禁止行为: 引用的数据/统计资料/调查结果/文摘/引用语不真实/不准确/未表明出处
    触发词: [数据表明, 调查显示, 研究表明, 销量, 排名, 市场份额]
    severity: medium
    note: 引用数据必须真实并标注来源，否则违反

  - id: ADV-A11
    条款号: 广告法第11条
    类目: 引证规范
    禁止行为: 未标明引证内容的出处
    触发词: [调查显示, 数据表明, 研究显示, 据统计, 调查结果, 满意度]
    severity: medium
    note: 引用统计资料须为真实、准确，并表明出处

  - id: ADV-A13
    条款号: 广告法第13条
    类目: 贬低对手
    禁止行为: 贬低其他生产经营者的商品/服务
    触发词: [比竞品, 吊打, 秒杀友商, 碾压同行, 不如我们, 竞品不行]
    severity: high
    note: 含对比贬低同业即风险高

  - id: ADV-A14
    条款号: 广告法第14条
    类目: 虚假代言
    禁止行为: 假冒他人名义/虚假代言/未授权使用他人形象
    触发词: [明星同款, 大牌同款, 同款, 明星推荐]
    severity: medium
    note: 未获授权使用他人形象涉嫌虚假

  - id: ADV-A16
    条款号: 广告法第16条
    类目: 医疗广告
    禁止行为: 医疗/药品/器械广告含功效保证/治愈率/有效率/与其他对比/推荐医师
    触发词: [包治, 根治, 治愈, 治愈率, 有效率, 立竿见影, 药到病除]
    severity: high
    note: 医疗类功效保证为高风险

  - id: ADV-A17
    条款号: 广告法第17条
    类目: 食品广告
    禁止行为: 食品广告涉及疾病预防/治疗功能，普通食品宣称保健功能
    触发词: [治疗, 预防, 治愈, 疗效, 减肥, 降糖, 降血压, 抗癌]
    severity: high
    note: 普通食品不得宣称保健/治疗功效

  - id: ADV-A18
    条款号: 广告法第18条
    类目: 保健食品
    禁止行为: 保健食品广告含功效保证/疾病预防治疗/利用国家机关/单位/个人名义作推荐证明
    触发词: [包治百病, 延年益寿, 无副作用, 疗效, 根治, 替代药物]
    severity: high
    note: 保健食品需标"本品不能代替药物"

  - id: ADV-A20
    条款号: 广告法第20条
    类目: 母婴/乳制品
    禁止行为: 在大众传播媒介发布乳制品/代乳制品广告（婴儿配方乳粉等特殊医学用途）
    触发词: [婴儿奶粉, 婴幼儿配方, 代乳]
    severity: high
    note: 婴幼儿配方乳粉等不得在大众媒介发布广告

  - id: ADV-A22
    条款号: 广告法第22条
    类目: 酒类广告
    禁止行为: 酒类广告出现饮酒/诱导饮酒/出现饮酒动作/明示/暗示饮酒有消除紧张焦虑/增加体力等功效
    触发词: [干杯, 一口闷, 助兴, 解忧, 壮胆, 越喝越]
    severity: high
    note: 不得诱导饮酒或宣称饮酒功效

  - id: ADV-A23
    条款号: 广告法第23条
    类目: 教育培训
    禁止行为: 教育/培训广告对升学/通过考试/获得学位/取得效果作明示/暗示保证性承诺
    触发词: [包过, 保过, 包就业, 一次性通过, 必过, 不过退款, 100%录取]
    severity: high
    note: 教育培训效果保证为高风险

  - id: ADV-A25
    条款号: 广告法第25条
    类目: 招商/金融理财
    禁止行为: 招商/金融理财广告对未来效果作保证性承诺/明示保本保收益
    触发词: [保本, 保收益, 稳赚, 稳赚不赔, 零风险, 无风险, 100%收益, 加盟稳赚]
    severity: high
    note: 金融/招商收益保证为高风险

  - id: ADV-A26
    条款号: 广告法第26条
    类目: 房地产广告
    禁止行为: 房地产广告含升值/投资回报承诺/以项目到达某一具体参照物所需时间表示距离/违反国家价格规定
    触发词: [升值, 投资回报, 距XX仅X分钟, 稳赚, 包租, 返租]
    severity: high
    note: 房地产广告不得承诺升值或回报

  - id: ADV-A28
    条款号: 广告法第28条
    类目: 虚假广告
    禁止行为: 虚假/引人误解的广告（虚假内容、虚假效果、引人误解的表述）
    触发词: [免费, 限量, 抽中, 中奖, 100%, 立竿见影, 神效]
    severity: high
    note: 任何虚假或引人误解表述均可触发

  - id: ADV-A40
    条款号: 广告法第40条
    类目: 未成年保护
    禁止行为: 针对不满十四周岁未成年人广告含劝诱其要求家长购买/可能引发模仿不良行为的内容
    触发词: [儿童, 少儿, 小学生, 劝诱]
    severity: high
    note: 针对未成年人的广告有特殊限制

  - id: ADV-A46
    条款号: 广告法第46条
    类目: 医疗广告审查
    禁止行为: 发布医疗广告未经审查/未按审查证明发布
    触发词: [医院, 诊所, 诊疗, 治疗, 疗法]
    severity: medium
    note: 医疗广告须经审查，发布前核实是否取得《医疗广告审查证明》
